name: Build and Deploy

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 954976298234.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: floral-bluegrass-sheepdog
  NAMESPACE: dev
  HELM_VALUES: deploy/helm/values/eks-dev.yaml

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      patient-service: ${{ steps.filter.outputs.patient-service }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      health-records-service: ${{ steps.filter.outputs.health-records-service }}
      analytics-service: ${{ steps.filter.outputs.analytics-service }}
      audit-service: ${{ steps.filter.outputs.audit-service }}
      location-service: ${{ steps.filter.outputs.location-service }}
      translation-service: ${{ steps.filter.outputs.translation-service }}
      interpretation-service: ${{ steps.filter.outputs.interpretation-service }}
      mcp-server: ${{ steps.filter.outputs.mcp-server }}
      voice-agent-service: ${{ steps.filter.outputs.voice-agent-service }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            patient-service:
              - 'services/patient-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            auth-service:
              - 'services/auth-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            api-gateway:
              - 'services/api-gateway/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            notification-service:
              - 'services/notification-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            health-records-service:
              - 'services/health-records-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            analytics-service:
              - 'services/analytics-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            audit-service:
              - 'services/audit-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            location-service:
              - 'services/location-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            translation-service:
              - 'services/translation-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            interpretation-service:
              - 'services/interpretation-service/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            mcp-server:
              - 'services/mcp-server/**'
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
            voice-agent-service:
              - 'services/voice-agent-service/**'
            web:
              - 'web/**'
            mobile:
              - 'mobile/**'
            infra:
              - 'deploy/kubernetes/development/postgres-deployment.yaml'
              - 'deploy/kubernetes/development/redis-deployment.yaml'
              - 'deploy/kubernetes/development/rabbitmq-deployment.yaml'
              - 'deploy/kubernetes/development/jaeger.yaml'
            helm:
              - 'deploy/helm/**'

  build:
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - patient-service
          - auth-service
          - api-gateway
          - notification-service
          - health-records-service
          - analytics-service
          - audit-service
          - location-service
          - translation-service
          - interpretation-service
          - mcp-server
          - voice-agent-service
          - web
          - mobile
    if: |
      needs.filter.outputs[format('{0}', matrix.service)] == 'true' ||
      needs.filter.outputs.helm == 'true' ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build and push — Go service
        if: matrix.service != 'voice-agent-service' && matrix.service != 'web' && matrix.service != 'mobile'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/development/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest

      - name: Build and push — voice-agent-service (Python)
        if: matrix.service == 'voice-agent-service'
        uses: docker/build-push-action@v6
        with:
          context: ./services/voice-agent-service
          file: ./services/voice-agent-service/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/voice-agent-service:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/voice-agent-service:latest

      - name: Build and push — web
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/development/web.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8081' }}
            NEXT_PUBLIC_LOCATION_WS_URL=${{ vars.NEXT_PUBLIC_LOCATION_WS_URL || 'ws://localhost:8091' }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/web:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/web:latest

      - name: Build and push — mobile
        if: matrix.service == 'mobile'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/development/mobile.Dockerfile
          build-args: |
            EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:8081' }}
            EXPO_PUBLIC_LOCATION_WS_URL=${{ vars.EXPO_PUBLIC_LOCATION_WS_URL || 'ws://localhost:8091' }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/mobile:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/mobile:latest

      - name: Update Helm values
        run: |
          sed -i "s|tag: latest|tag: ${{ steps.tag.outputs.tag }}|" ${{ env.HELM_VALUES }}

      - name: Upload Helm values artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-values-${{ matrix.service }}
          path: ${{ env.HELM_VALUES }}

  deploy:
    needs: [filter, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Download Helm values
        uses: actions/download-artifact@v4
        with:
          pattern: helm-values-*
          path: /tmp/helm-values

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx

      - name: Deploy with Helm
        run: |
          helm dependency build deploy/helm/
          helm upgrade --install zorbahealth deploy/helm/ \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_VALUES }} \
            --create-namespace \
            --wait \
            --timeout 15m
