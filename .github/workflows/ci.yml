name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: healthai
          POSTGRES_USER: healthai
          POSTGRES_PASSWORD: healthai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthai -d healthai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate protobufs
        run: make generate-proto
      - name: Generate sqlc
        run: make sqlc
      - name: Verify clean generated diff
        run: git diff --exit-code
      - name: Go tests
        run: go test ./services/... ./shared/... -count=1
      - name: Migration smoke
        env:
          DATABASE_URL: postgres://healthai:healthai@localhost:5432/healthai?sslmode=disable
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xz
          chmod +x migrate
          ./migrate -path migrations -database "$DATABASE_URL" up
          ./migrate -path migrations -database "$DATABASE_URL" down 2

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  security-scans:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: zricethezav/gitleaks-action@v2
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
