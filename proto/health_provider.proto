syntax = "proto3";

package health_provider;

option go_package = "shared/proto/health_provider;health_provider";

// HealthProviderService owns hospital/organization and staff membership domain.
// Credential users are created via auth-service; this service creates hospitals + hospital_staff rows.
service HealthProviderService {
  rpc RegisterHospital(RegisterHospitalRequest) returns (RegisterHospitalResponse);
  rpc RegisterHospitalStaff(RegisterHospitalStaffRequest) returns (RegisterHospitalResponse);
}

message RegisterHospitalRequest {
  string hospital_name = 1;
  string license_no = 2;
  string staff_name = 3;
  string email = 4;
  string phone_number = 5;
  string password = 6;
  string staff_role = 7;
}

message RegisterHospitalStaffRequest {
  string hospital_id = 1;
  string staff_name = 2;
  string email = 3;
  string phone_number = 4;
  string password = 5;
  string staff_role = 6;
}

message RegisterHospitalResponse {
  string message = 1;
  string user_id = 2;
  string hospital_id = 3;
  string staff_id = 4;
  string staff_role = 5;
}
