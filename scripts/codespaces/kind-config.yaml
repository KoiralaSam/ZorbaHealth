# kind cluster for GitHub Codespaces / local DinD.
# Usage: ./scripts/codespaces/kind-up.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zorba
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
