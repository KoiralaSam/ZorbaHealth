# EKS Auto Mode: nodes only in the NAT-backed private subnet (stable egress via NAT EIP).
# Apply: ./deploy/aws/static-egress/apply-auto-mode-egress.sh
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: static-egress
spec:
  role: AmazonEKSAutoNodeRole
  securityGroupSelectorTerms:
    - id: sg-07b76144c462341b2
  subnetSelectorTerms:
    - id: subnet-0523d6c3d4836a1c6
  snatPolicy: Random
  ephemeralStorage:
    size: 40Gi
