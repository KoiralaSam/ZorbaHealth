apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: static-egress
spec:
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
  limits:
    cpu: "8"
    memory: 16Gi
  template:
    metadata:
      labels:
        zorbahealth.io/egress: static
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: static-egress
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        # t3.small alone is rejected by EKS Auto Mode (NoCompatibleInstanceTypes).
        - key: eks.amazonaws.com/instance-category
          operator: In
          values:
            - c
            - t
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values:
            - "2"
        - key: eks.amazonaws.com/instance-size
          operator: In
          values:
            - small
            - medium
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
      taints:
        - key: zorbahealth.io/egress
          value: static
          effect: NoSchedule
      # expireAfter + terminationGracePeriod (default 24h) must be ≤ 21 days on EKS Auto Mode
      expireAfter: 336h
