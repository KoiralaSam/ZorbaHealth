apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-service
          image: appointment-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9099
              name: grpc
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  key: ENVIRONMENT
                  name: app-config
            - name: JAEGER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: JAEGER_ENDPOINT
                  name: app-config
            - name: APPOINTMENT_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: APPOINTMENT_SERVICE_GRPC_ADDR
                  name: app-config
            - name: AUDIT_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: AUDIT_SERVICE_GRPC_ADDR
                  name: app-config
            - name: LIVEKIT_WS_URL
              valueFrom:
                configMapKeyRef:
                  key: LIVEKIT_WS_URL
                  name: app-config
            - name: LIVEKIT_URL
              valueFrom:
                configMapKeyRef:
                  key: LIVEKIT_URL
                  name: app-config
            - name: LIVEKIT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  key: LIVEKIT_PUBLIC_WS_URL
                  name: app-config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: app-secrets
            - name: PATIENT_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: PATIENT_SERVICE_JWT_SECRET
                  name: app-secrets
            - name: AUTH_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: AUTH_SERVICE_JWT_SECRET
                  name: app-secrets
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: rabbitmq-credentials
                  optional: true
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: rabbitmq-credentials
                  optional: true
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_SERVICE_SECRET
                  name: app-secrets
                  optional: true
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: LIVEKIT_API_KEY
                  name: app-secrets
                  optional: true
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  key: LIVEKIT_API_SECRET
                  name: app-secrets
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
spec:
  type: ClusterIP
  ports:
    - port: 9099
      targetPort: 9099
      name: grpc
  selector:
    app: appointment-service
