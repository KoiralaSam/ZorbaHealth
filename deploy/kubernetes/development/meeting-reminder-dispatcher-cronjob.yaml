apiVersion: batch/v1
kind: CronJob
metadata:
  name: meeting-reminder-dispatcher
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 4
  startingDeadlineSeconds: 50
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app: meeting-reminder-dispatcher
        spec:
          restartPolicy: OnFailure
          containers:
            - name: meeting-reminder-dispatcher
              image: patient-service
              imagePullPolicy: IfNotPresent
              command: ["./build/meeting-reminder-dispatcher"]
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "150m"
              env:
                - name: ENVIRONMENT
                  valueFrom:
                    configMapKeyRef:
                      key: ENVIRONMENT
                      name: app-config
                - name: JAEGER_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      key: JAEGER_ENDPOINT
                      name: app-config
                - name: MEETING_REMINDER_DISPATCH_LIMIT
                  value: "25"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      key: DATABASE_URL
                      name: app-secrets
                - name: RABBITMQ_URI
                  valueFrom:
                    secretKeyRef:
                      key: uri
                      name: rabbitmq-credentials
                - name: LIVEKIT_URL
                  valueFrom:
                    configMapKeyRef:
                      key: LIVEKIT_URL
                      name: app-config
                - name: LIVEKIT_WS_URL
                  valueFrom:
                    configMapKeyRef:
                      key: LIVEKIT_WS_URL
                      name: app-config
                - name: LIVEKIT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: apiKey
                      name: livekit-credentials
                - name: LIVEKIT_API_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: apiSecret
                      name: livekit-credentials
                - name: LIVEKIT_USE_STUB
                  valueFrom:
                    configMapKeyRef:
                      key: LIVEKIT_USE_STUB
                      name: app-config
                      optional: true
