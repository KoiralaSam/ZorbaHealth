apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  ENVIRONMENT: "development"
  # OTLP HTTP (Jaeger all-in-one with COLLECTOR_OTLP_ENABLED=true)
  JAEGER_ENDPOINT: "http://jaeger:4318/v1/traces"
  # API Gateway
  API_GATEWAY_HTTP_ADDR: ":8081"
  API_GATEWAY_ALLOWED_ORIGINS: "http://localhost:3000"
  # Dev-only: accept any localhost/127.0.0.1 origin so temporary verification
  # servers (next start / static previews on ephemeral ports) can call the API.
  API_GATEWAY_ALLOW_LOCALHOST_ORIGINS: "true"
  # Patient Service
  PATIENT_SERVICE_HTTP_ADDR: ":8083"
  PATIENT_SERVICE_GRPC_ADDR: "patient-service:9093"
  # Auth Service
  AUTH_SERVICE_HTTP_ADDR: ":8082"
  AUTH_SERVICE_GRPC_ADDR: "auth-service:9092"
  # Health Provider Service
  HEALTH_PROVIDER_SERVICE_GRPC_ADDR: "health-provider-service:9094"
  # Appointment Service
  APPOINTMENT_SERVICE_GRPC_ADDR: "appointment-service:9099"
  # LiveKit runs on host Docker (deploy/docker/livekit/). Pods use host.minikube.internal;
  # browsers/join links use LIVEKIT_PUBLIC_WS_URL (host public or LAN IP — update if it changes).
  LIVEKIT_WS_URL: "ws://host.minikube.internal:7880"
  LIVEKIT_URL: "ws://host.minikube.internal:7880"
  LIVEKIT_PUBLIC_WS_URL: "ws://34.30.50.212:7880"
  MCP_HTTP_ADDR: ":8092"
  # RAG Service
  RAG_SERVICE_GRPC_ADDR: "rag-service:50053"
  # Medical Records Service
  MEDICAL_RECORDS_SERVICE_GRPC_ADDR: "health-records-service:50054"
  HEALTH_RECORDS_SERVICE_GRPC_ADDR: "health-records-service:50054"
  # Analytics Service
  ANALYTICS_SERVICE_GRPC_ADDR: "analytics-service:50054"
  # Audit Service
  AUDIT_SERVICE_GRPC_ADDR: "audit-service:50058"
  # Notification Service
  NOTIFICATION_SERVICE_GRPC_ADDR: "notification-service:50056"
  # Translation Service
  TRANSLATION_SERVICE_GRPC_ADDR: "translation-service:50057"
  TRANSLATION_PROVIDER: "amazon_translate"
  TRANSLATION_MODEL_BASE_URL: "http://translation-model:8080"
  AWS_REGION: "us-east-1"
  # Location Service
  LOCATION_SERVICE_HTTP_ADDR: ":8090"
  LOCATION_SERVICE_GRPC_ADDR: "location-service:50051"
  LOCATION_REDIS_DB: "0"
  LOCATION_REDIS_KEY_PREFIX: "location:session:"
  LOCATION_REDIS_SESSION_TTL_SEC: "0"
  IP_GEOLOCATION_TIMEOUT_SEC: "5"
  INTERPRETATION_SERVICE_HTTP_ADDR: ":8095"
  # OTP HTTP server (SMS via VoIP.ms) — credentials in voipms-credentials secret
  HTTP_ADDR: ":3000"
  VOIPMS_DID: "3185162690"
  # Patient-facing Zorba voice hotline (E.164). Defaults from VOIPMS_DID in api-gateway if unset.
  ZORBA_VOICE_PHONE_NUMBER: "+13185162690"
  # Public web base URL used to generate verification links in emails
  PUBLIC_WEB_BASE_URL: "http://localhost:3000"
  # Looser OTP SMS rate limits for local development
  AUTH_OTP_SEND_LIMIT_PER_PHONE: "30"
  AUTH_OTP_SEND_WINDOW_SEC: "3600"
  AUTH_OTP_VERIFY_LIMIT_PER_PHONE: "50"
  AUTH_OTP_VERIFY_LIMIT_PER_IP: "100"
  AUTH_OTP_VERIFY_WINDOW_SEC: "900"

  # PostgreSQL (host/port/db name only; credentials in app-secrets)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "healthai"
  POSTGRES_DB: "healthai"
  # Redis
  REDIS_ADDR: "redis:6379"
