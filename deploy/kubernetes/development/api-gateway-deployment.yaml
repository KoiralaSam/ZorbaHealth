apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  key: ENVIRONMENT
                  name: app-config
            - name: JAEGER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: JAEGER_ENDPOINT
                  name: app-config
            - name: API_GATEWAY_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  key: API_GATEWAY_HTTP_ADDR
                  name: app-config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: app-secrets
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  key: REDIS_ADDR
                  name: app-config
            - name: PATIENT_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: PATIENT_SERVICE_GRPC_ADDR
                  name: app-config
            - name: AUTH_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: AUTH_SERVICE_GRPC_ADDR
                  name: app-config
            - name: HEALTH_RECORDS_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: HEALTH_RECORDS_SERVICE_GRPC_ADDR
                  name: app-config
            - name: AUDIT_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: AUDIT_SERVICE_GRPC_ADDR
                  name: app-config
            - name: PATIENT_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: PATIENT_SERVICE_JWT_SECRET
                  name: app-secrets
            - name: AUTH_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: AUTH_SERVICE_JWT_SECRET
                  name: app-secrets
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_SERVICE_SECRET
                  name: app-secrets
            - name: RAG_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: RAG_SERVICE_GRPC_ADDR
                  name: app-config
            - name: MEDICAL_RECORDS_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: MEDICAL_RECORDS_SERVICE_GRPC_ADDR
                  name: app-config
            - name: ANALYTICS_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: ANALYTICS_SERVICE_GRPC_ADDR
                  name: app-config
            - name: NOTIFICATION_SERVICE_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  key: NOTIFICATION_SERVICE_GRPC_ADDR
                  name: app-config
            - name: PUBLIC_WEB_BASE_URL
              valueFrom:
                configMapKeyRef:
                  key: PUBLIC_WEB_BASE_URL
                  name: app-config
            - name: AUTH_OTP_SEND_LIMIT_PER_PHONE
              valueFrom:
                configMapKeyRef:
                  key: AUTH_OTP_SEND_LIMIT_PER_PHONE
                  name: app-config
            - name: AUTH_OTP_SEND_WINDOW_SEC
              valueFrom:
                configMapKeyRef:
                  key: AUTH_OTP_SEND_WINDOW_SEC
                  name: app-config
            - name: AUTH_OTP_VERIFY_LIMIT_PER_PHONE
              valueFrom:
                configMapKeyRef:
                  key: AUTH_OTP_VERIFY_LIMIT_PER_PHONE
                  name: app-config
            - name: AUTH_OTP_VERIFY_LIMIT_PER_IP
              valueFrom:
                configMapKeyRef:
                  key: AUTH_OTP_VERIFY_LIMIT_PER_IP
                  name: app-config
            - name: AUTH_OTP_VERIFY_WINDOW_SEC
              valueFrom:
                configMapKeyRef:
                  key: AUTH_OTP_VERIFY_WINDOW_SEC
                  name: app-config
            - name: LIVEKIT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  key: LIVEKIT_PUBLIC_WS_URL
                  name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app: api-gateway
