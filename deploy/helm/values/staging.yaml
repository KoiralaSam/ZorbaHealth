global:
  environment: staging

ingress:
  enabled: true
  rules:
    - host: api.staging.zorbahealth.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: api-gateway
          servicePort: 8081
    - host: staging.zorbahealth.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: web
          servicePort: 3000
    - host: mobile.staging.zorbahealth.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: mobile
          servicePort: 8084

infra:
  postgres:
    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 1Gi
        cpu: 1000m
  redis:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 500m
  rabbitmq:
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m

