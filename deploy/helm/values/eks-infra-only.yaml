# Install only deploy/helm/charts/infra (Postgres, Redis, RabbitMQ, Jaeger).
# Use before app images exist in ECR:
#   ./deploy/aws/helm-install.sh --infra-only

global:
  nodeAffinityUserMode: false

postgres:
  storageClass: gp3
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

rabbitmq:
  storageClass: gp3
  resources:
    requests:
      memory: 200Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 250m

redis:
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 128Mi
      cpu: 200m

jaeger:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m
