# EKS dev cluster (floral-bluegrass-sheepdog, us-east-1).
# Image repos default to 954976298234.dkr.ecr.us-east-1.amazonaws.com in subchart values.yaml.

global:
  environment: development
  nodeAffinityUserMode: false

ingress:
  enabled: true
  rules:
    - host: api.zorbahealth.dev
      paths:
        - path: /
          pathType: Prefix
          serviceName: api-gateway
          servicePort: 8081
    - host: zorbahealth.dev
      paths:
        - path: /
          pathType: Prefix
          serviceName: web
          servicePort: 3000
    - host: mobile.zorbahealth.dev
      paths:
        - path: /
          pathType: Prefix
          serviceName: mobile
          servicePort: 8084

postgres:
  enabled: true
redis:
  enabled: true
rabbitmq:
  enabled: true
jaeger:
  enabled: true

infra:
  postgres:
    # Requires EBS CSI (Auto Mode block storage) — apply deploy/aws/eks-gp3-storageclass.yaml
    storageClass: gp3
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
  redis:
    resources:
      requests:
        memory: 64Mi
        cpu: 25m
      limits:
        memory: 128Mi
        cpu: 200m
  rabbitmq:
    storageClass: gp3
    resources:
      requests:
        memory: 200Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 250m
  jaeger:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 250m

