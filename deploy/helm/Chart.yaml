apiVersion: v2
name: zorbahealth
description: Umbrella Helm chart for ZorbaHealth platform
type: application
version: 0.1.0
appVersion: "1.0"
dependencies:
  - name: infra
    version: 0.1.0
    repository: file://charts/infra
  - name: patient-service
    version: 0.1.0
    repository: file://charts/patient-service
  - name: auth-service
    version: 0.1.0
    repository: file://charts/auth-service
  - name: api-gateway
    version: 0.1.0
    repository: file://charts/api-gateway
  - name: notification-service
    version: 0.1.0
    repository: file://charts/notification-service
  - name: health-records-service
    version: 0.1.0
    repository: file://charts/health-records-service
  - name: analytics-service
    version: 0.1.0
    repository: file://charts/analytics-service
  - name: audit-service
    version: 0.1.0
    repository: file://charts/audit-service
  - name: location-service
    version: 0.1.0
    repository: file://charts/location-service
  - name: translation-service
    version: 0.1.0
    repository: file://charts/translation-service
  - name: interpretation-service
    version: 0.1.0
    repository: file://charts/interpretation-service
  - name: mcp-server
    version: 0.1.0
    repository: file://charts/mcp-server
  - name: voice-agent-service
    version: 0.1.0
    repository: file://charts/voice-agent-service
  - name: web
    version: 0.1.0
    repository: file://charts/web
  - name: mobile
    version: 0.1.0
    repository: file://charts/mobile
  - name: ingress-nginx
    repository: https://kubernetes.github.io/ingress-nginx
    version: 4.11.0
    condition: ingress-nginx.enabled
