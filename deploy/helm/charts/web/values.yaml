image:
  repository: web
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 1
ports:
  - containerPort: 3000
    name: http
env:
  - name: NODE_ENV
    value: "production"
  - name: HOSTNAME
    value: "0.0.0.0"
  - name: PORT
    value: "3000"
resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 1Gi
    cpu: "1"
probes:
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
service:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
